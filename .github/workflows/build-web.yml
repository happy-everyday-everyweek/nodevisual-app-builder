name: Build Web

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '用于命名产物的版本标签（留空则使用 SHA）'
        required: false
        default: ''
  push:
    branches:
      - fix/web-build-test

permissions:
  contents: read

jobs:
  build-web:
    name: Build Web Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.3'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Read pubspec version
        id: pubver
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected pubspec version: $VERSION"

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Build Web
        run: flutter build web --release --no-tree-shake-icons

      - name: Resolve artifact name
        id: artifact
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME:-${GITHUB_SHA::7}}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Pack web build
        run: |
          cd build/web
          zip -r "../../nodevisual-web-${{ steps.artifact.outputs.tag }}.zip" .

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodevisual-web-${{ steps.artifact.outputs.tag }}
          path: nodevisual-web-${{ steps.artifact.outputs.tag }}.zip
          if-no-files-found: error
          retention-days: 30
