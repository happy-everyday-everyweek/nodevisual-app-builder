name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '用于命名产物的版本标签（留空则使用 SHA）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.3'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Read pubspec version
        id: pubver
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected pubspec version: $VERSION"

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Resolve artifact name
        id: artifact
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME:-${GITHUB_SHA::7}}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodevisual-app-builder-${{ steps.artifact.outputs.tag }}-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            ## NodeVisual App Builder ${{ github.ref_name }}

            ### 产物
            - `app-release.apk` — Android Release APK（debug 签名）

            ### pubspec 版本
            ${{ steps.pubver.outputs.version }}

            ### 构建信息
            - 触发分支: ${{ github.ref_name }}
            - 提交: ${{ github.sha }}
