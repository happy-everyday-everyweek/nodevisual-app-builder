name: Release Multi-Platform

# 统一多端发布工作流：Tag 触发后同时构建 Android APK 与 Web 版本，
# Web 产物会部署到 GitHub Pages（gh-pages 分支）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '用于命名产物的版本标签（留空则使用 SHA）'
        required: false
        default: ''
      deploy_pages:
        description: '是否部署 Web 到 GitHub Pages（仅 tag 触发默认 true）'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# 同一 tag 的新构建会取消旧的；Pages 部署串行以避免冲突。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------- Android
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.artifact.outputs.tag }}
      version: ${{ steps.pubver.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.3'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Read pubspec version
        id: pubver
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected pubspec version: $VERSION"

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Resolve artifact name
        id: artifact
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME:-${GITHUB_SHA::7}}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
             "artifacts/nodevisual-${{ steps.artifact.outputs.tag }}-android.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodevisual-${{ steps.artifact.outputs.tag }}-apk
          path: artifacts/nodevisual-${{ steps.artifact.outputs.tag }}-android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/nodevisual-${{ steps.artifact.outputs.tag }}-android.apk
          body: |
            ## NodeVisual App Builder ${{ github.ref_name }}

            ### 产物
            - `nodevisual-${{ steps.artifact.outputs.tag }}-android.apk` — Android Release APK（debug 签名）
            - Web 版本：构建后部署到 GitHub Pages

            ### pubspec 版本
            ${{ steps.pubver.outputs.version }}

            ### 构建信息
            - 触发: ${{ github.ref_name }}
            - 提交: ${{ github.sha }}

  # --------------------------------------------------------------------- Web
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-apk
    outputs:
      tag: ${{ steps.artifact.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.3'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Build Web
        run: flutter build web --release --no-tree-shake-icons --base-href "/${{ github.event.repository.name }}/"

      - name: Resolve artifact name
        id: artifact
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            RAW="${GITHUB_REF_NAME:-${GITHUB_SHA::7}}"
            TAG="${RAW//\//-}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Add version manifest
        run: |
          cat > build/web/version.json <<EOF
          {
            "tag": "${{ steps.artifact.outputs.tag }}",
            "version": "${{ needs.build-apk.outputs.version }}",
            "commit": "${{ github.sha }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Pack web build
        run: |
          cd build/web
          zip -r "../../nodevisual-web-${{ steps.artifact.outputs.tag }}.zip" .

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodevisual-web-${{ steps.artifact.outputs.tag }}
          path: nodevisual-web-${{ steps.artifact.outputs.tag }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Web zip to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: nodevisual-web-${{ steps.artifact.outputs.tag }}.zip

      - name: Deploy to GitHub Pages
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.deploy_pages == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
          commit_message: "deploy: ${{ steps.artifact.outputs.tag }}"
