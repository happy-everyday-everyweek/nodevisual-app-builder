<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NodeVisual App Builder - 端侧可视化节点编程工具">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NodeVisual">
  <meta name="theme-color" content="#FFFFFF">

  <title>NodeVisual App Builder</title>
  <style>
    body { margin: 0; padding: 0; background: #FFFFFF; }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      color: #1C1C1E;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      z-index: 9999;
    }
    #splash .loader {
      width: 32px;
      height: 32px;
      border: 3px solid #E5E5EA;
      border-top-color: #1C1C1E;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="splash">
    <div class="loader"></div>
  </div>
  <script src="flutter.js"></script>
  <script>
    // flutter.js is loaded synchronously (no defer) above, so _flutter.loader
    // is available when this inline script runs.
    _flutter.buildConfig = {
      "engineRevision": "e672b006cb34c921db85b8e2f482ed3144a4574b",
      "builds": [{"compileTarget": "dart2js", "renderer": "canvaskit", "mainJsPath": "main.dart.js"}]
    };
    _flutter.loader.load({
      onEntrypointLoaded: async function (engineInitializer) {
        var appRunner = await engineInitializer.initializeEngine();
        await appRunner.runApp();
        var splash = document.getElementById('splash');
        if (splash) splash.style.display = 'none';
      }
    });
  </script>
</body>
</html>
